<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="MiniMax-H3 视频生成">MiniMax-H3 视频生成</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236366f1'/%3E%3Cpath d='M11 9l9 7-9 7z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --primary:#6366f1;--primary-dark:#4f46e5;--secondary:#8b5cf6;
  --bg:#0f172a;--bg-light:#1e293b;--bg-lighter:#334155;--bg-hover:#3f4d63;
  --text:#f1f5f9;--text-sec:#94a3b8;--text-dim:#64748b;--border:#475569;--border-l:#54607a;
  --success:#10b981;--warning:#f59e0b;--error:#ef4444;
  --accent:#6366f1;--accent-bg:rgba(99,102,241,.15);
  --shadow:0 10px 15px -3px rgba(0,0,0,.5);--radius:12px;--radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-light)}
::-webkit-scrollbar-thumb{background:var(--bg-lighter);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--primary)}

.app{display:flex;flex-direction:column;height:100vh}

/* ===== TOPBAR ===== */
.topbar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:8px 18px;background:var(--bg-light);border-bottom:1px solid var(--border);z-index:30}
.topbar .logo{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.topbar .logo i{color:var(--primary)}
.ws-sel{background:var(--bg-lighter);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-size:13px;cursor:pointer;max-width:160px}
.ws-sel option{background:var(--bg-lighter)}
.icon-btn{background:var(--bg-lighter);border:1px solid var(--border);color:var(--text-sec);width:32px;height:32px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;font-size:13px}
.icon-btn:hover{background:var(--bg-hover);color:var(--text)}
.seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{background:transparent;border:none;color:var(--text-sec);cursor:pointer;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:500;transition:.15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.seg button.active{background:var(--bg-lighter);color:var(--text)}
.seg button:hover:not(.active){color:var(--text)}
.lang-seg button{padding:4px 10px;font-size:11px}
.lang-seg button.active{background:var(--primary);color:#fff}
.topbar .spacer{flex:1}
.comfy-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sec)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim)}
.dot.up{background:var(--success);box-shadow:0 0 6px var(--success)}
.dot.down{background:var(--error)}

/* ===== VIEWS ===== */
.view{flex:1;display:none;overflow:hidden;min-height:0}
.view.active{display:flex}

/* ===== CHAT VIEW ===== */
.view-chat{flex-direction:column}
.chat-msgs{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:18px;max-width:900px;margin:0 auto;width:100%}
.msg{display:flex;animation:fade .3s;max-width:100%}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.msg-bubble{max-width:78%;display:flex;flex-direction:column;gap:6px}
.msg.user .msg-bubble{align-items:flex-end}
.msg-card{padding:13px 16px;border-radius:var(--radius);font-size:14px;line-height:1.55;position:relative}
.msg.user .msg-card{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.bot .msg-card{background:var(--bg-light);border-bottom-left-radius:4px}
.msg-time{font-size:11px;color:var(--text-sec);padding:0 4px}
.msg-label{font-size:12px;color:var(--text-sec);display:flex;align-items:center;gap:6px}
.msg-label i{font-size:11px}
.ref-img{max-width:220px;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer;transition:.2s}
.ref-img:hover{transform:scale(1.02);box-shadow:var(--shadow)}
.gen-video{width:100%;max-width:480px;border-radius:var(--radius-sm);background:#000;display:block;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{font-size:11px;padding:2px 8px;border-radius:5px;background:rgba(99,102,241,.15);color:#c7d2fe;white-space:nowrap}
.chip.warn{background:rgba(245,158,11,.15);color:var(--warning)}
.chip.full{background:rgba(139,92,246,.15);color:#c4b5fd}
.err-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:var(--radius-sm);padding:11px;color:var(--error);font-size:13px}
.err-box details{margin-top:6px}
.err-box summary{cursor:pointer;font-size:11px;color:var(--text-sec)}
.err-box pre{margin-top:5px;font-size:10px;white-space:pre-wrap;max-height:200px;overflow:auto;color:var(--text-sec);background:rgba(0,0,0,.2);padding:8px;border-radius:6px}
.ok-box{color:var(--success);font-size:12px;display:flex;align-items:center;gap:5px}
.progress-wrap{display:flex;flex-direction:column;gap:8px;padding:6px 0;min-width:260px}
.progress-top{display:flex;justify-content:space-between;font-size:12px}
.progress-bar{height:6px;background:var(--bg-lighter);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:3px;transition:width .3s;width:0%}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border-l);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* chat input */
.chat-input{flex-shrink:0;padding:14px 22px 18px;border-top:1px solid var(--border);background:var(--bg-light);max-width:900px;margin:0 auto;width:100%}
.menu-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;flex-wrap:wrap}
.menu-chip{background:var(--bg-lighter);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;color:var(--text);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.menu-chip:hover{border-color:var(--primary);background:var(--accent-bg)}
.menu-chip.on{background:var(--accent-bg);border-color:var(--primary);color:#c7d2fe}
.input-row{display:flex;gap:8px;align-items:flex-end}
.img-upload input{display:none}
.img-btn{width:48px;height:48px;border:1px dashed var(--border);border-radius:var(--radius-sm);background:var(--bg-lighter);color:var(--text-sec);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.15s;overflow:hidden;flex-shrink:0}
.img-btn:hover{border-color:var(--primary);color:var(--primary)}
.img-btn img{width:100%;height:100%;object-fit:cover}
.prompt-input{flex:1;background:var(--bg-lighter);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;color:var(--text);font-size:14px;font-family:inherit;resize:none;max-height:120px;min-height:48px;line-height:1.5;transition:.15s}
.prompt-input:focus{outline:none;border-color:var(--primary)}
.send-btn{background:var(--primary);color:#fff;border:none;border-radius:var(--radius);padding:0 18px;height:48px;font-weight:600;font-size:14px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0}
.send-btn:hover:not(:disabled){background:var(--primary-dark)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.send-btn .spinner{border-color:rgba(255,255,255,.3);border-top-color:#fff}

/* ===== OVERVIEW VIEW ===== */
.view-overview{flex-direction:column}
.filterbar{flex-shrink:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--bg-light)}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:320px}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:12px}
.search-wrap input{width:100%;background:var(--bg-lighter);border:1px solid var(--border);color:var(--text);padding:7px 10px 7px 30px;border-radius:7px;font-size:12px}
.search-wrap input:focus{outline:none;border-color:var(--primary)}
.filterbar select{background:var(--bg-lighter);border:1px solid var(--border);color:var(--text-sec);padding:7px 10px;border-radius:7px;font-size:12px;cursor:pointer}
.filterbar select option{background:var(--bg-lighter)}
.filterbar .count{font-size:11px;color:var(--text-dim);margin-left:auto}
.ov-scroll{flex:1;overflow-y:auto;padding:18px}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ov-card{background:var(--bg-light);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:.2s;position:relative;display:flex;flex-direction:column;animation:fade .3s}
.ov-card:hover{border-color:var(--border-l);transform:translateY(-2px);box-shadow:var(--shadow)}
.ov-thumb{position:relative;aspect-ratio:16/9;background:var(--bg-lighter);overflow:hidden;cursor:pointer}
.ov-thumb video{width:100%;height:100%;object-fit:cover}
.ov-thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:28px;background:linear-gradient(135deg,#1e293b,#0f172a)}
.ov-badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;padding:2px 7px;border-radius:5px}
.ov-badge.dur{top:auto;left:auto;bottom:6px;right:6px}
.ov-badge.err{background:rgba(239,68,68,.8)}
.ov-badge.run{background:var(--accent-bg);color:var(--primary);border:1px solid var(--primary)}
.ov-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;opacity:.85;pointer-events:none}
.ov-card:hover .ov-play{background:var(--primary);opacity:1}
.ov-acts{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8),transparent 60%);opacity:0;transition:.2s;display:flex;justify-content:flex-end;padding:8px;gap:5px}
.ov-card:hover .ov-acts{opacity:1}
.ov-acts button{background:rgba(255,255,255,.15);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.2);color:#fff;width:28px;height:28px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:.15s}
.ov-acts button:hover{background:var(--primary);border-color:var(--primary)}
.ov-acts button.del:hover{background:var(--error);border-color:var(--error)}
.ov-body{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:6px}
.ov-prompt{font-size:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ov-prompt.expanded{-webkit-line-clamp:unset}
.ov-chips{display:flex;flex-wrap:wrap;gap:3px}
.ov-meta{font-size:10px;color:var(--text-dim);display:flex;gap:6px;align-items:center;margin-top:auto}
.ov-empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-sec)}
.ov-empty i{font-size:44px;color:var(--text-dim);margin-bottom:12px;display:block}
.ov-empty b{font-size:15px;color:var(--text)}

/* ===== STUDIO VIEW ===== */
.view-studio{flex-direction:row}
.st-left{width:280px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg)}
.st-left-head{padding:10px 12px 6px;border-bottom:1px solid var(--border);flex-shrink:0}
.st-left-head h3{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.st-count{background:var(--bg-lighter);color:var(--text-sec);font-size:10px;padding:1px 6px;border-radius:9px}
.st-search{position:relative}
.st-search i{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:10px}
.st-search input{width:100%;background:var(--bg-light);border:1px solid var(--border);color:var(--text);padding:5px 8px 5px 24px;border-radius:6px;font-size:11px}
.st-search input:focus{outline:none;border-color:var(--primary)}
.st-list{flex:1;overflow-y:auto;padding:4px}
.st-item{display:flex;gap:8px;padding:7px;border-radius:var(--radius-sm);cursor:pointer;transition:.12s;margin-bottom:2px;position:relative}
.st-item:hover{background:var(--bg-light)}
.st-item.active{background:var(--bg-lighter);box-shadow:inset 2px 0 0 var(--primary)}
.st-thumb{width:52px;height:38px;flex-shrink:0;border-radius:5px;overflow:hidden;background:var(--bg-lighter);position:relative}
.st-thumb video,.st-thumb img{width:100%;height:100%;object-fit:cover}
.st-thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px;background:linear-gradient(135deg,#1e293b,#0f172a)}
.st-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.st-prompt{font-size:11px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.st-meta{font-size:9px;color:var(--text-dim);display:flex;gap:4px;flex-wrap:wrap}
.st-meta .m{color:var(--primary);font-weight:600}
.st-meta .m.full{color:#c4b5fd}
.st-reuse{position:absolute;right:5px;top:5px;background:var(--bg-lighter);border:1px solid var(--border);width:20px;height:20px;border-radius:5px;display:none;align-items:center;justify-content:center;color:var(--text-sec);cursor:pointer;font-size:9px}
.st-cont{position:absolute;right:29px;top:5px;background:var(--bg-lighter);border:1px solid var(--border);width:20px;height:20px;border-radius:5px;display:none;align-items:center;justify-content:center;color:var(--primary);cursor:pointer;font-size:9px}
.st-item:hover .st-reuse,.st-item:hover .st-cont{display:flex}
.st-reuse:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.st-cont:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.st-center{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.st-stage{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;align-items:center}
.st-stage-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-dim);text-align:center;gap:10px}
.st-stage-empty i{font-size:48px}
.st-stage-empty b{font-size:16px;color:var(--text-sec)}
.st-stage-empty p{font-size:12px;max-width:300px}
.st-run{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;width:100%;max-width:500px}
.prog-ring{position:relative;width:140px;height:140px}
.prog-ring svg{transform:rotate(-90deg)}
.prog-ring .track{fill:none;stroke:var(--bg-lighter);stroke-width:7}
.prog-ring .fill{fill:none;stroke:var(--primary);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .4s}
.prog-ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.prog-ring .pct b{font-size:32px;font-weight:700}
.prog-ring .pct span{font-size:11px;color:var(--text-sec);margin-top:-4px}
.phase-info{text-align:center}
.phase-info .pl{font-size:14px;display:flex;align-items:center;gap:8px;justify-content:center}
.phase-info .ps{font-size:11px;color:var(--text-sec);margin-top:3px}
.prog-wide{width:100%;max-width:420px;height:5px;background:var(--bg-lighter);border-radius:3px;overflow:hidden}
.prog-wide .fill{height:100%;background:var(--primary);border-radius:3px;transition:width .3s}
.timer{font-size:12px;color:var(--text-sec);font-variant-numeric:tabular-nums;display:flex;gap:14px}
.timer b{color:var(--text)}
.st-done{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.st-video-wrap{position:relative;max-width:100%;border-radius:var(--radius);overflow:hidden;background:#000;box-shadow:var(--shadow);border:1px solid var(--border)}
.st-video-wrap video{display:block;max-width:100%;max-height:55vh}
.st-expand{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.st-expand:hover{background:var(--primary);border-color:var(--primary)}
.st-info{width:100%;max-width:620px;background:var(--bg-light);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.st-info .si-prompt{font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
.st-info .si-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.st-info .si-meta{font-size:10px;color:var(--text-dim);display:flex;gap:12px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--border)}
.st-actions{display:flex;gap:6px}
.btn{background:var(--bg-lighter);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:7px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:.15s}
.btn:hover{background:var(--bg-hover);border-color:var(--border-l)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.danger:hover{background:var(--error);border-color:var(--error);color:#fff}
.st-error{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;max-width:560px;text-align:center}
.st-error .err-card{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:var(--radius);padding:16px;width:100%;text-align:left}
.st-error .err-card i{color:var(--error);margin-right:6px}
.st-error .err-msg{color:var(--error);font-size:12px;white-space:pre-wrap;word-break:break-word}
.st-right{width:360px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-light);overflow:hidden}
.st-panel{flex:1;overflow-y:auto;padding:12px}
.st-sec{margin-bottom:14px}
.st-sec .st-title{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.img-drop{border:1.5px dashed var(--border-l);border-radius:var(--radius);height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:.15s;color:var(--text-sec);position:relative;overflow:hidden}
.img-drop:hover{border-color:var(--primary);background:var(--accent-bg)}
.img-drop i{font-size:20px}
.img-drop span{font-size:11px}
.img-drop.has-img{padding:0;border-style:solid;border-color:var(--border)}
.img-drop.has-img img{width:100%;height:100%;object-fit:cover}
.img-drop .ovl{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),transparent);display:flex;align-items:flex-end;padding:6px;font-size:10px;color:#fff}
.img-drop .chg{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.6);border:none;color:#fff;width:24px;height:24px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px}
.st-textarea{width:100%;background:var(--bg-lighter);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:var(--radius-sm);font-size:13px;line-height:1.5;resize:vertical;min-height:70px;font-family:inherit}
.st-textarea:focus{outline:none;border-color:var(--primary)}
.st-prompt-foot{display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);margin-top:3px}
.field{margin-bottom:8px}
.field label{display:block;font-size:11px;color:var(--text-sec);margin-bottom:3px}
.sel,.txt,.num{width:100%;background:var(--bg-lighter);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:6px;font-size:12px;font-family:inherit}
.sel:focus,.txt:focus,.num:focus{outline:none;border-color:var(--primary)}
.sel option{background:var(--bg-lighter)}
.row2{display:flex;gap:6px}
.row2>*{flex:1}
.slider-row{display:flex;align-items:center;gap:8px}
.slider-row input[type=range]{flex:1;accent-color:var(--primary);height:4px}
.slider-row .sv{font-size:12px;min-width:30px;text-align:right;font-weight:600}
.dur-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.dur-btn{background:var(--bg-lighter);border:1px solid var(--border);color:var(--text-sec);padding:6px;border-radius:6px;cursor:pointer;font-size:11px;transition:.12s}
.dur-btn:hover{color:var(--text)}
.dur-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.res-preview{font-size:11px;color:var(--primary);background:var(--accent-bg);padding:4px 8px;border-radius:6px;margin-top:4px;display:flex;align-items:center;gap:4px}
.res-preview.warn{background:rgba(245,158,11,.12);color:var(--warning)}
.toggle{display:flex;align-items:flex-start;gap:8px;cursor:pointer;padding:5px 0;font-size:12px;color:var(--text-sec)}
.toggle:hover{color:var(--text)}
.toggle input{display:none}
.toggle .box{width:16px;height:16px;border:1.5px solid var(--border-l);border-radius:4px;flex-shrink:0;position:relative;transition:.15s;margin-top:1px}
.toggle input:checked+.box{background:var(--primary);border-color:var(--primary)}
.toggle input:checked+.box::after{content:'';position:absolute;left:4px;top:0px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.toggle .t-desc{display:block;font-size:9px;color:var(--text-dim);margin-top:1px}
.st-foot{flex-shrink:0;padding:10px 12px;border-top:1px solid var(--border)}
.gen-btn{width:100%;background:var(--primary);border:none;color:#fff;padding:11px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
.gen-btn:hover:not(:disabled){background:var(--primary-dark)}
.gen-btn:disabled{opacity:.5;cursor:not-allowed}
.gen-btn .spinner{border-color:rgba(255,255,255,.3);border-top-color:#fff}

/* ===== POPUP ===== */
.popup{position:fixed;bottom:88px;right:22px;width:340px;max-height:calc(100vh - 160px);overflow-y:auto;background:var(--bg-light);border-radius:var(--radius);box-shadow:var(--shadow);z-index:50;padding:18px;display:flex;flex-direction:column;gap:14px;opacity:0;pointer-events:none;transform:translateY(12px);transition:.25s;border:1px solid var(--border)}
.popup.active{opacity:1;pointer-events:all;transform:none}
.pop-sec{display:flex;flex-direction:column;gap:10px}
.pop-title{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
.pop-title i{color:var(--primary)}
.toggle input:checked+.box::after{content:'✓';color:#fff;font-size:11px;left:2px;top:-1px;border:none;width:auto;height:auto;transform:none;background:none}

/* ===== LIGHTBOX ===== */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:100;display:none;align-items:center;justify-content:center;padding:28px}
.lightbox.show{display:flex}
.lb-close{position:absolute;top:14px;right:18px;background:rgba(255,255,255,.1);border:none;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:17px}
.lb-close:hover{background:var(--error)}
.lb-content{display:flex;max-width:1240px;width:100%;max-height:88vh;background:var(--bg-light);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.lb-vside{flex:1;min-width:0;background:#000;display:flex;align-items:center;justify-content:center}
.lb-vside video{max-width:100%;max-height:88vh}
.lb-dside{width:300px;flex-shrink:0;border-left:1px solid var(--border);overflow-y:auto;padding:14px}
.lb-dside h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin-bottom:7px;font-weight:600}
.lb-dside .lb-prompt{font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-bottom:14px}
.lb-dside .lb-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.lb-dside .lb-row{display:flex;justify-content:space-between;font-size:11px;padding:3px 0}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--bg-lighter);border:1px solid var(--border-l);color:var(--text);padding:9px 16px;border-radius:9px;font-size:13px;z-index:200;box-shadow:var(--shadow);transition:.3s;opacity:0;display:flex;align-items:center;gap:7px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast i{color:var(--primary)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px;text-align:center;color:var(--text-sec);flex:1}
.empty i{font-size:48px;margin-bottom:16px;opacity:.4;color:var(--primary)}
.empty b{font-size:17px;margin-bottom:8px;color:var(--text)}
.empty p{max-width:360px;line-height:1.6;font-size:13px}

@media(max-width:900px){
  .view-studio{flex-direction:column}
  .st-left{width:100%;height:120px;border-right:none;border-bottom:1px solid var(--border)}
  .st-right{width:100%;border-left:none;border-top:1px solid var(--border);max-height:45vh}
  .lb-content{flex-direction:column}
  .lb-dside{width:100%;border-left:none;border-top:1px solid var(--border);max-height:35vh}
}

/* ===== REF2VA (r2v) ===== */
.task-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px}
.task-seg button{border:none;background:transparent;color:var(--text-sec);font-size:11px;padding:6px 2px;border-radius:6px;cursor:pointer;font-weight:500;transition:.15s;white-space:nowrap}
.task-seg button.active{background:var(--primary);color:#fff}
.r2v-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.r2v-cell{position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--bg);cursor:pointer}
.r2v-cell img{width:100%;height:100%;object-fit:cover;display:block}
.r2v-cell .cell-num{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.68);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;letter-spacing:.3px}
.r2v-cell .cell-del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:none;background:rgba(220,53,69,.9);color:#fff;font-size:10px;cursor:pointer;display:none;align-items:center;justify-content:center}
.r2v-cell:hover .cell-del{display:flex}
.r2v-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--text-dim);font-size:10px;border-style:dashed;cursor:pointer;background:transparent}
.r2v-add i{font-size:17px;color:var(--text-dim)}
.r2v-add:hover{border-color:var(--primary);color:var(--primary)}
.r2v-add:hover i{color:var(--primary)}
.r2v-tip{font-size:10px;color:var(--text-dim);margin-top:6px;line-height:1.5}

.r2v-audios{display:flex;flex-direction:column;gap:4px}
.r2v-vids{display:flex;flex-direction:column;gap:4px}
.r2v-vid-row{display:flex;align-items:center;gap:6px;background:var(--bg-light);border:1px solid var(--border);border-radius:7px;padding:3px 6px;font-size:10px;color:var(--text-sec)}
.r2v-vid-row video{width:72px;height:40px;object-fit:cover;border-radius:5px;background:#000;flex-shrink:0}
.r2v-vid-row .tag{background:rgba(111,66,193,.2);color:#c39dff;font-weight:700;padding:1px 6px;border-radius:8px;font-family:ui-monospace,Consolas,monospace;white-space:nowrap;flex-shrink:0}
.r2v-aud-row{display:flex;align-items:center;gap:6px;background:var(--bg-light);border:1px solid var(--border);border-radius:7px;padding:3px 6px;font-size:10px;color:var(--text-sec)}
.r2v-aud-row .tag{background:rgba(111,66,193,.2);color:#c39dff;font-weight:700;padding:1px 6px;border-radius:8px;font-family:ui-monospace,Consolas,monospace;white-space:nowrap;flex-shrink:0}
.r2v-aud-row audio{height:24px;max-width:150px;flex-shrink:0}
.r2v-aud-row .dur{color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums;flex-shrink:0}
.r2v-aud-row .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-dim)}
.r2v-aud-del{border:none;background:rgba(220,53,69,.15);color:#ff6b6b;width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.r2v-aud-del:hover{background:var(--error);color:#fff}
.r2v-aud-add{width:100%;margin-top:6px;padding:6px;font-size:11px;justify-content:center;border-style:dashed;color:var(--text-sec)}
.guide-details{margin-top:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);overflow:hidden}
.guide-details summary{cursor:pointer;padding:8px 10px;font-size:12px;font-weight:600;color:var(--text-sec);list-style:none;display:flex;align-items:center;gap:7px;user-select:none}
.guide-details summary::before{content:'\f059';font-family:'Font Awesome 6 Free';font-weight:900;color:var(--primary)}
.guide-details summary:hover{color:var(--text)}
.guide-body{padding:4px 10px 10px;font-size:11px;color:var(--text-sec);line-height:1.7;white-space:pre-wrap}
.guide-body .g-btn{width:100%;margin-bottom:8px;font-size:11px;padding:6px}
.guide-body code{background:rgba(127,127,127,.15);padding:1px 5px;border-radius:4px;font-size:10px;color:var(--text)}
.guide-body .six{margin-bottom:6px}
.chip.r2v{background:rgba(111,66,193,.18);color:#c39dff;border-color:rgba(111,66,193,.4)}
.badge-refs{display:inline-flex;align-items:center;gap:3px;background:rgba(111,66,193,.15);color:#c39dff;border:1px solid rgba(111,66,193,.35);font-size:9px;font-weight:700;padding:2px 6px;border-radius:9px;vertical-align:middle}
.img-btn{position:relative;overflow:visible}
.img-btn .img-n{position:absolute;top:-4px;right:-4px;background:var(--primary);color:#fff;border-radius:9px;font-size:9px;font-weight:700;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px;pointer-events:none}
.r2v-cell img{pointer-events:none}
.msg-refs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.msg-refs .ref-img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:zoom-in}

.c-mode-seg{display:inline-flex;gap:3px;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:2px;margin-left:auto}

.c-edit-wrap{flex:1;min-height:0;position:relative;background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.c-edit-wrap:focus-within{border-color:var(--primary)}
#cMirror{position:absolute;inset:0;overflow:hidden;padding:12px 14px;font-size:13px;line-height:1.75;font-family:inherit;white-space:pre-wrap;word-break:break-word;color:var(--text);pointer-events:none;tab-size:2;letter-spacing:normal}
#cMirror .hg{border-radius:3px;padding:0 1px}
#cMirror .hg.err{background:rgba(239,68,68,.32)}

.c-sec textarea{width:100%;border:none;outline:none;background:transparent;color:var(--text);resize:none;padding:9px 10px;font-size:12.5px;line-height:1.7;font-family:inherit;min-height:52px;display:block;scrollbar-width:thin}

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="logo"><i class="fas fa-clapperboard"></i> H3 Studio</div>

let LANG=(new URLSearchParams(location.search).get('lang'))||localStorage.getItem('h3_lang')||((navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en');
function langIsZh(){return LANG==='zh';}
function t(s,vars){if(!langIsZh()&&EN_MAP[s]!=null)s=EN_MAP[s];if(vars)for(const k in vars)s=s.split('{'+k+'}').join(vars[k]);return s;}
function transStatus(s){if(!s)return'';if(langIsZh())return s;const m=s.match(/执行节点\s*(.+)/);if(m)return t('执行节点 {n}',{n:m[1]});return s;}
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.getAttribute('data-i18n'));});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.getAttribute('data-i18n-ph'));});
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.title=t(el.getAttribute('data-i18n-title'));});
  if($('stGuideBody'))$('stGuideBody').innerHTML=guideHtml();
  document.documentElement.lang=LANG;
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG));
}
function setLang(l){LANG=l;localStorage.setItem('h3_lang',l);applyLang();renderActive();syncTaskUI();syncChips();syncPopup();syncStudioPanel();if(composerOpen()){refreshComposerRefs();renderComposerTools();renderComposerSide();renderIssues();}}

const api=(p,opt)=>fetch(p,opt).then(async r=>{if(r.ok)return r.status===204?null:r.json();let m=r.status+' '+r.statusText,tb='';try{const j=await r.json();m=j.error||j.detail||JSON.stringify(j);tb=j.traceback||'';}catch(_){try{m=await r.text();}catch(__){}}const e=new Error(m);e.traceback=tb;throw e;});

// ===== UTILS =====
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function durationFrames(sec){const t=sec*24;const n=Math.max(0,Math.ceil((t-5)/17));return 5+17*n;}
function fmtDur(sec){return(durationFrames(sec)/24).toFixed(1)+'s';}
function timeNow(){return new Date().toLocaleString('zh-CN',{hour12:false});}
function relTime(ts){if(!ts)return'';const d=new Date(ts.replace(' ','T'));const diff=(Date.now()-d.getTime())/1000;if(isNaN(diff))return'';if(diff<60)return t('刚刚');if(diff<3600)return t('{n} 分钟前',{n:Math.floor(diff/60)});if(diff<86400)return t('{n} 小时前',{n:Math.floor(diff/3600)});return t('{n} 天前',{n:Math.floor(diff/86400)});}
function mediaUrl(g,f){return'/api/workspaces/'+encodeURIComponent(App.curWs)+'/media/'+encodeURIComponent(f);}
function isR2V(g){return (g&&(g.task_type==='r2v'||(g.params&&g.params.task_type==='r2v')));}
function paramsChips(p){const c=[];if(p&&p.task_type==='r2v')c.push({t:t('r2v 多素材'),cls:'r2v'});else if(p&&p.task_type==='t2v')c.push({t:t('t2v 文字'),cls:'r2v'});else if(p&&p.frame_mode==='last')c.push({t:t('i2v·尾帧'),cls:'r2v'});else if(p&&p.frame_mode==='both')c.push({t:t('i2v·首尾帧'),cls:'r2v'});c.push({t:p.model==='full'?'full':(p.model==='ref2va'?'ref2va':'pruned'),cls:p.model==='full'?'full':''});const w=p.width||p.custom_w,h=p.height||p.custom_h;c.push({t:(w&&h)?w+'×'+h:t('原生'),cls:''});c.push({t:t('{n} 步',{n:p.steps}),cls:''});c.push({t:fmtDur(p.duration||5),cls:''});if(p.sage)c.push({t:'sage',cls:'warn'});if(p.turbo_lora)c.push({t:'turbo',cls:'warn'});c.push({t:p.seed>=0?'#'+p.seed:t('随机'),cls:''});return c;}
function refsCountBadge(n){return n?`<span class="badge-refs"><i class="fas fa-images"></i> r2v ×${n}</span>`:'';}
function audioRefsBadge(n){return n?`<span class="badge-refs"><i class="fas fa-microphone"></i> ${t('音频')}×${n}</span>`:'';}
function videoRefsBadge(n){return n?`<span class="badge-refs"><i class="fas fa-film"></i> ${t('视频')}×${n}</span>`:'';}
function REF_TIP_HTML(){return t('图/视频按上传顺序编号：图用 <b>&lt;Picture N&gt;</b>（主体用 <b>&lt;Subject N&gt;</b>，勿用 &lt;Object x&gt;），视频 ≤3 段（每段 2–15s, 总 ≤15s）用 <b>&lt;Video N&gt;</b> 引用（剪辑/续写/运镜参考）。可选加 <b>&lt;=3 段音频</b>，用 <b>&lt;Audio N&gt;</b> 引用（含视频原声, 音轨编号先于独立音频）');}

async function checkComfy(){try{const s=await api('/api/comfyui/status');$('comfyDot').className='dot '+(s.up?'up':'down');$('comfyTxt').textContent=s.up?t('在线'):t('离线');if(s.durations)App.settings.durations=s.durations;if(s.res_presets)App.settings.res_presets=s.res_presets;if(s.max_pixels)App.settings.max_pixels=s.max_pixels;if(typeof s.ref2va_present!=='undefined'){App.settings.ref2va_present=s.ref2va_present;App.settings.ref2va_model=s.ref2va_model||'';syncTaskUI();}}catch(e){$('comfyDot').className='dot down';$('comfyTxt').textContent=t('离线');}}
async function loadWorkspaces(){App.workspaces=await api('/api/workspaces');const sel=$('wsSel');sel.innerHTML=App.workspaces.map(w=>`<option value="${esc(w.name)}">${esc(w.name)} (${w.count})</option>`).join('');if(App.curWs)sel.value=App.curWs;renderResPresets();renderDurGrid();}
async function selectWs(name){App.curWs=name;$('wsSel').value=name;App.uploadedImage=null;App.refsImages=[];App.currentGen=null;resetImgUIs();await loadGens();}

// ===== VIEW SWITCHING =====
function switchView(v){
  // collect params from old view
  if(App.view==='chat')collectPopup();
  if(App.view==='studio')collectStudioPanel();
  App.prompt=getActivePromptValue();
  App.view=v;
  // sync UIs
  if(v==='chat'){syncPopup();setChatPrompt(App.prompt);}
  if(v==='studio'){syncStudioPanel();setStudioPrompt(App.prompt);}
  // toggle
  document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id==='view'+v.charAt(0).toUpperCase()+v.slice(1)));
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  renderActive();
  syncImgUIs();
}
function renderActive(){
  if(App.view==='chat')renderChat();
  else if(App.view==='overview')renderOverview();
  else if(App.view==='studio')renderStudio();
}
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>switchView(b.dataset.v));

// ===== TASK TYPE (i2v 单图 / r2v 多素材) =====
function taskIsR2V(){return App.params.task_type==='r2v';}
function applyTask(t){
  const wasR2V=taskIsR2V(); App.params.task_type=(t==='r2v')?'r2v':(t==='t2v'?'t2v':'i2v'); const isR2V=taskIsR2V(); const isT2V=App.params.task_type==='t2v';
  if(isR2V){
    // 模型自动选 ref2va; 分辨率无 native 语义 -> custom; turbo 默认关
    if(App.params.model!=='ref2va')App.params.model='ref2va';
    App.params.res_mode='custom';
    App.params.turbo_lora=false;
    if(!App.refsImages.length&&App.uploadedImage)App.refsImages=[App.uploadedImage]; // 单图顺延为第1张参考
    if(App.params.steps<=8)App.params.steps=20; // 非 turbo 官方常用步数
  }else{
    if(App.params.model==='ref2va')App.params.model='pruned';
    if(App.params.steps>12)App.params.steps=4;
    // 切回 i2v: 若无单图, 取第1张参考图兜底 (参考素材仍在 refs, 可再切回)
    if(!App.uploadedImage&&App.refsImages.length)App.uploadedImage=App.refsImages[0];
    if(isT2V&&App.params.res_mode==='native')App.params.res_mode='custom'; // 文生无 native 语义 (无来源图)
  }
  syncTaskUI();syncImgUIs();syncStudioPanel();syncPopup();updateGenBtns();updateResPreviews();
  if(App.view==='chat')syncChips();
}
function syncTaskUI(){
  const r2v=taskIsR2V(); const tt=App.params.task_type; const t2v=tt==='t2v'; const fm=App.params.frame_mode||'first';
  [['stTaskSeg','stTaskTip'],['pTaskSeg','pTaskTip']].forEach(([segId,tipId])=>{
    const seg=$(segId);if(!seg)return;
    seg.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.t===tt));
    $(tipId).textContent=r2v?t('多素材参考（核心节点链）→ 图片按 <Picture N> 引用'):(t2v?t('纯文字描述 → 音视频（T8 链, 无需素材）'):t('单参考图 → 视频（T8 链）'));
  });
  const fs2=$('stFrameSeg');if(fs2){fs2.style.display=(!r2v&&!t2v)?'flex':'none';fs2.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.f===fm));}
  // 模型下拉: r2v 锁 ref2va; i2v 锁 pruned/full
  const stM=$('stModel'),pM=$('pModel');
  [stM,pM].forEach(sel=>{if(sel){[...sel.options].forEach(o=>{o.disabled=r2v?(o.value!=='ref2va'):(o.value==='ref2va');});sel.value=r2v?'ref2va':(App.params.model==='ref2va'?'pruned':App.params.model);}});
  // 分辨率: r2v 无 native 语义 -> 禁用 native 选项并强制 custom
  const noNative=r2v||t2v;
  ['stResMode','pResMode'].forEach(id=>{const s=$(id);if(s){[...s.options].forEach(o=>o.disabled=noNative&&o.value==='native');if(noNative&&s.value==='native'){s.value='custom';App.params.res_mode='custom';}}});
  // 步数上限: r2v 官方 20 步起步 -> 50; i2v turbo 档 -> 12
  ['stSteps','pSteps'].forEach(id=>{const s=$(id);if(s){s.max=r2v?50:12;if(+s.value>+s.max)s.value=s.max;}});
  ['stStepsVal','pStepsVal'].forEach(id=>{const el=$(id);if(el)el.textContent=App.params.steps;});
  // Studio 参考区显隐
  const r2vPanel=!!$('stRefGrid');
  if(r2vPanel){
    $('stImgDrop').style.display=(!r2v&&!t2v)?'block':'none';
    const sdl=$('stImgDropLast');if(sdl)sdl.style.display=(!r2v&&!t2v&&fm==='both')?'block':'none';
    const rs=$('stRefSec');if(rs)rs.style.display=t2v?'none':''; // t2v: 无素材概念, 整框隐藏
    $('stRefGrid').style.display=r2v?'grid':'none';
    const rt=$('stRefTip');if(rt){rt.style.display=r2v?'block':'none';rt.innerHTML=r2v?REF_TIP_HTML():'';}
    $('stGuide').style.display=r2v?'block':'none';
    const pt=$('stPromptTools');if(pt)pt.style.display=r2v?'flex':'none';
    const cc=$('chipComposer');if(cc)cc.style.display=r2v?'':'none';
    const sa=$('stAudAdd');if(sa)sa.style.display=(r2v&&App.refsAudios.length<R2V_MAX_AUDIOS)?'':'none';
    const sab=$('stRefAudios');if(sab){if(r2v&&App.curWs)renderRefAudios();else sab.style.display='none';}
    const sv=$('stVidAdd');if(sv)sv.style.display=(r2v&&App.refsVideos.length<R2V_MAX_VIDEOS)?'':'none';
    const svb=$('stRefVideos');if(svb){if(r2v&&App.curWs)renderRefVideos();else svb.style.display='none';}
    const vta=$('stVidAudioToggle');if(vta)vta.style.display=(r2v&&App.refsVideos.length)?'flex':'none';
    if(r2v)renderRefGrid();
  }
  // ref2va 权重缺失提示 (仅 r2v 且已探测)
  const miss=!App.settings.ref2va_present;
  if(r2v){const tip=$('stTaskTip');if(tip&&miss)tip.textContent=t('⚠ ref2va 权重未检测到（{m}），生成会被 ComfyUI 拒绝',{m:(App.settings.ref2va_model||'?')});}
}

// ===== r2v 多图上传 (Studio 9 格 + chat 逐张追加) =====
async function addRefImageFiles(files){
  if(!App.curWs){showToast(t('先选工作区'),'warn');return;}
  const list=[...files].filter(f=>f&&f.type&&f.type.startsWith('image/'));
  if(!list.length){showToast(t('请选择图片文件'),'warn');return;}
  const room=R2V_MAX_IMAGES-App.refsImages.length;
  if(room<=0){showToast(t('最多 {n} 张参考图',{n:R2V_MAX_IMAGES}),'warn');return;}
  if(list.length>room)showToast(t('最多 {n} 张参考图（本次取前 {m} 张）',{n:R2V_MAX_IMAGES,m:room}),'warn');
  for(const f of list.slice(0,room)){
    try{
      const fd=new FormData();
      fd.append('type','image');
      fd.append('file',f,f.name);
      const res=await api('/api/workspaces/'+encodeURIComponent(App.curWs)+'/upload-media',{method:'POST',body:fd});
      App.refsImages.push(res.filename);
      renderRefGrid();syncImgUIs();updateGenBtns();updateResPreviews();
    }catch(e){showToast(t('上传失败: ')+e.message,'warn');break;}
  }
  if(App.refsImages.length>=R2V_MAX_IMAGES)showToast(t('已满 {n} 张',{n:R2V_MAX_IMAGES}),'check');
  refreshComposerRefs();
}
function renderRefGrid(){
  const grid=$('stRefGrid');if(!grid)return;
  let html='';
  App.refsImages.forEach((fn,i)=>{
    html+=`<div class="r2v-cell" data-i="${i}"><img src="/api/workspaces/${encodeURIComponent(App.curWs)}/media/${encodeURIComponent(fn)}"><span class="cell-num">&lt;Picture ${i+1}&gt;</span><button class="cell-del" title="${t('删除')}"><i class="fas fa-xmark"></i></button></div>`;
  });
  if(App.refsImages.length<R2V_MAX_IMAGES){
    html+=`<div class="r2v-cell r2v-add" id="stRefAdd"><i class="fas fa-plus"></i><span>${t('添加')}</span></div>`;
  }
  grid.innerHTML=html;
  grid.querySelectorAll('.r2v-cell[data-i]').forEach(cell=>{
    const i=+cell.dataset.i;
    cell.querySelector('.cell-del').onclick=e=>{e.stopPropagation();App.refsImages.splice(i,1);renderRefGrid();syncImgUIs();updateGenBtns();updateResPreviews();};
  });
  const add=$('stRefAdd');if(add)add.onclick=()=>$('stRefFiles').click();
}
function removeAllRefs(){App.refsImages=[];App.refsAudios=[];App.refsVideos=[];renderRefGrid();renderRefAudios();renderRefVideos();syncImgUIs();syncTaskUI();updateGenBtns();updateResPreviews();refreshComposerRefs();}

// ===== r2v 音频参考 (P2: <=3 段, 每段 2-15s; 服务端逐段校验时长) =====
async function addRefAudioFiles(files){
  if(!App.curWs){showToast(t('先选工作区'),'warn');return;}
  const list=[...files].filter(f=>f&&f.type&&f.type.startsWith('audio/'));
  if(!list.length){showToast(t('请选择音频文件'),'warn');return;}
  const room=R2V_MAX_AUDIOS-App.refsAudios.length;
  if(room<=0){showToast(t('最多 {n} 段参考音频',{n:R2V_MAX_AUDIOS}),'warn');return;}
  if(list.length>room)showToast(t('最多 {n} 段（本次取前 {m} 段）',{n:R2V_MAX_AUDIOS,m:room}),'warn');
  for(const f of list.slice(0,room)){
    try{
      const fd=new FormData();fd.append('type','audio');fd.append('file',f,f.name);
      const res=await api('/api/workspaces/'+encodeURIComponent(App.curWs)+'/upload-media',{method:'POST',body:fd});
      App.refsAudios.push({fn:res.filename,dur:res.duration_s});
      renderRefAudios();updateGenBtns();
    }catch(e){showToast(t('音频上传失败: ')+e.message,'warn');break;}

  if(App.refsAudios.length>=R2V_MAX_AUDIOS)showToast(t('音频已满 {n} 段',{n:R2V_MAX_AUDIOS}),'check');
  refreshComposerRefs();
}
function renderRefAudios(){
  const box=$('stRefAudios');if(!box)return;
  const r2v=taskIsR2V()&&App.curWs;
  box.style.display=(r2v&&App.refsAudios.length)?'flex':'none';
  box.innerHTML=App.refsAudios.map((a,i)=>`<div class="r2v-aud-row" title="${esc(a.fn)}"><span class="tag">&lt;Audio ${audioOrdinalBase()+i+1}&gt;</span><audio controls preload="none" src="${mediaUrl('',a.fn)}"></audio><span class="dur">${a.dur!=null?a.dur+'s':'…'}</span><span class="fn">${esc(a.fn)}</span><button class="r2v-aud-del" data-i="${i}" title="${t('删除')}"><i class="fas fa-xmark"></i></button></div>`).join('');
  box.querySelectorAll('.r2v-aud-del').forEach(b=>b.onclick=()=>{App.refsAudios.splice(+b.dataset.i,1);renderRefAudios();updateGenBtns();refreshComposerRefs();});
}
// P3: 视频原声占用的 <Audio N> 序号数 (官方 conditioning 顺序: 图 -> 视频(音轨标签先于视频) -> 独立音频)
function audioOrdinalBase(){return (taskIsR2V()&&App.useVideoAudio)?App.refsVideos.filter(v=>v.aud).length:0;}
async function addRefVideoFiles(files){
  if(!App.curWs){showToast(t('先选工作区'),'warn');return;}
  const list=[...files].filter(f=>f&&f.type&&f.type.startsWith('video/'));
  if(!list.length){showToast(t('请选择视频文件'),'warn');return;}
  const room=R2V_MAX_VIDEOS-App.refsVideos.length;
  if(room<=0){showToast(t('最多 {n} 段参考视频',{n:R2V_MAX_VIDEOS}),'warn');return;}
  if(list.length>room)showToast(t('最多 {n} 段参考视频（本次取前 {m} 段）',{n:R2V_MAX_VIDEOS,m:room}),'warn');
  for(const f of list.slice(0,room)){
    try{
      const fd=new FormData();fd.append('type','video');fd.append('file',f,f.name);
      const res=await api('/api/workspaces/'+encodeURIComponent(App.curWs)+'/upload-media',{method:'POST',body:fd});
      App.refsVideos.push({fn:res.filename,dur:res.duration_s,aud:!!res.has_audio});
      renderRefVideos();updateGenBtns();refreshComposerRefs();
    }catch(e){showToast(t('视频上传失败: ')+e.message,'warn');break;}

  syncTaskUI(); // 上传后立即刷新 stVidAdd / stVidAudioToggle 等显隐

function checkVideoTotal(){
  const s=App.refsVideos.reduce((a,v)=>a+(v.dur||0),0);
  if(s>15)showToast(t('参考视频总时长 {s}s 超过 15s, 生成会被拒绝',{s:s.toFixed(1)}),'warn');
}
function renderRefVideos(){
  const box=$('stRefVideos');if(!box)return;
  const r2v=taskIsR2V()&&App.curWs;
  box.style.display=(r2v&&App.refsVideos.length)?'flex':'none';
  box.innerHTML=App.refsVideos.map((v,i)=>`<div class="r2v-vid-row" title="${esc(v.fn)}"><video muted preload="metadata" src="${mediaUrl('',v.fn)}#t=0.1"></video><span class="tag">&lt;Video ${i+1}&gt;</span><span class="dur">${v.dur!=null?v.dur+'s':'…'}</span><span class="fn">${esc(v.fn)}</span>${v.aud?'<i class="fas fa-volume-high" style="font-size:10px;color:var(--text-sec)" title="'+esc(t('含音轨'))+'"></i>':''}<button class="r2v-aud-del" data-i="${i}" title="${t('删除')}"><i class="fas fa-xmark"></i></button></div>`).join('');
  box.querySelectorAll('.r2v-aud-del').forEach(b=>b.onclick=()=>{App.refsVideos.splice(+b.dataset.i,1);renderRefVideos();updateGenBtns();refreshComposerRefs();syncTaskUI();});
  renderRefAudios(); // 视频增删会使原声占位的 <Audio N> 编号位移, 同步刷新音频标签
}
async function probeVideoDurations(){
  if(!App.curWs)return;
  for(const v of App.refsVideos){
    if(v.dur!=null)continue;
    try{
      const r=await api('/api/workspaces/'+encodeURIComponent(App.curWs)+'/probe-media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:v.fn})});
      v.dur=r.duration_s;if(r.has_audio!=null)v.aud=!!r.has_audio;renderRefVideos();
    }catch(_){}
  }
}

// ===== IMAGE UPLOAD (shared) =====
function handleImg(f,target){ // target='last': 上传为首尾帧模式的尾帧
  if(!App.curWs){showToast(t('先选工作区'),'warn');return;}
  if(taskIsR2V()){ // r2v 模式: 追加为多图参考
    addRefImageFiles([f]);return;
  }
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const res=await api('/api/workspaces/'+encodeURIComponent(App.curWs)+'/upload-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:r.result,mime:f.type})});
      if(target==='last')App.uploadedImageLast=res.filename;else App.uploadedImage=res.filename;
      syncImgUIs();updateGenBtns();updateResPreviews();showToast(t('图片已上传'),'check');
    }catch(e){showToast(t('上传失败: ')+e.message,'warn');}
  };
  r.readAsDataURL(f);
}
function syncImgUIs(){
  // chat img btn: i2v 显示单图; r2v 显示首图 + 计数
  const cb=$('chatImgBtn');
  if(App.refsImages.length&&taskIsR2V()&&App.curWs){cb.style.fontSize='9px';cb.innerHTML=`<img src="/api/workspaces/${encodeURIComponent(App.curWs)}/media/${encodeURIComponent(App.refsImages[0])}"><span class="img-n">${App.refsImages.length}</span>`;}
  else{cb.style.fontSize='';if(App.uploadedImage&&App.curWs&&!taskIsR2V()){cb.innerHTML=`<img src="/api/workspaces/${encodeURIComponent(App.curWs)}/media/${encodeURIComponent(App.uploadedImage)}">`;}
  else cb.innerHTML='<i class="fas fa-image"></i>';}
  // studio img drop (i2v family: 首帧/尾帧/首尾帧)
  const i2vFam=App.params.task_type==='i2v'; const fm=App.params.frame_mode||'first'; const ws=App.curWs;

// ===== GENERATION (shared) =====
function validateR2VPrompt(prompt,refCount,audCount,vidCount=0,audioBase=0){
  // <Picture N> 引用编号不得超过实际图片数
  const m=[...prompt.matchAll(/<Picture\s+(\d+)\s*>/g)].map(x=>+x[1]);
  if(m.length&&Math.max(...m)>refCount){
    return t('提示词引用了 <Picture {n}>, 但只上传了 {c} 张参考图',{n:Math.max(...m),c:refCount});
  }
  // <Video N> (P3) 引用编号不得超过实际视频段数
  const v=[...prompt.matchAll(/<Video\s+(\d+)\s*>/g)].map(x=>+x[1]);
  if(v.length&&Math.max(...v)>vidCount){
    return t('提示词引用了 <Video {n}>, 但只上传了 {c} 段参考视频',{n:Math.max(...v),c:vidCount});
  }
  // <Audio N> (P2/P3) 编号上限 = 视频原声占位数 + 独立音频段数 (官方: 音轨编号先于独立音频)
  const a=[...prompt.matchAll(/<Audio\s+(\d+)\s*>/g)].map(x=>+x[1]);
  if(a.length&&Math.max(...a)>audCount+audioBase){
    return t('提示词引用了 <Audio {n}>, 但可用音频编号只有 {c} 个',{n:Math.max(...a),c:audCount+audioBase});
  }
  // <Subject N> 应连续从 1 编号 (官方: 禁 <Object x>)
  if(/<Object\s/i.test(prompt))return t('官方语法禁止 <Object x>, 请用 <Subject N> 连续编号');
  return null;
}
let genTimer;
async function generate(){
  if(App.busy)return; // 忙时拒绝重复提交 (按钮 disabled 挡不住 Ctrl+Enter 快捷键)
  if(!App.curWs){showToast(t('先选工作区'),'warn');return;}
  const prompt=getActivePromptValue().trim();
  if(!prompt){showToast(t('先写提示词'),'warn');return;}
  if(!haveRefs()){showToast(taskIsR2V()?t('上传参考图或视频（r2v, 图≤9 视频≤3）'):t('先上传参考图'),'warn');return;}

  // r2v 提交前校验
  if(taskIsR2V()){
    if(App.refsImages.length+App.refsVideos.length+App.refsAudios.length>R2V_REF_TOTAL_MAX){showToast(t('参考素材总数 (图+视频+音频) 不能超过 12 个'),'warn');return;}
    const vs=App.refsVideos.reduce((a,x)=>a+(x.dur||0),0);
    if(vs>15){showToast(t('参考视频总时长 {s}s 超过 15s 上限',{s:vs.toFixed(1)}),'warn');return;}
    const err=validateR2VPrompt(prompt,App.refsImages.length,App.refsAudios.length,App.refsVideos.length,audioOrdinalBase());
    if(err){showToast(err,'warn');return;}
  }
  // collect params from active view
  if(App.view==='chat')collectPopup();if(App.view==='studio')collectStudioPanel();
  setGenBusy(true);
  const gid='tmp-'+Date.now();const t0=Date.now();
  const tmp={id:gid,ws:App.curWs,timestamp:timeNow(),prompt,params:{...App.params,width:App.params.custom_w,height:App.params.custom_h},image:taskIsR2V()?App.refsImages[0]:App.uploadedImage,image_last:(!taskIsR2V()&&(App.params.frame_mode||'first')==='both')?App.uploadedImageLast:null,task_type:App.params.task_type,refs:taskIsR2V()?{images:[...App.refsImages],audios:App.refsAudios.map(a=>a.fn),videos:App.refsVideos.map(v=>v.fn),video_audios:App.refsVideos.filter(v=>App.useVideoAudio&&v.aud).map(v=>v.fn)}:null,status:'running',_pct:0,_phase:t('提交中'),_t0:t0};
  App.gens.unshift(tmp);App.currentGen=tmp;renderActive();
  genTimer=setInterval(()=>{tmp._elapsed=Math.floor((Date.now()-t0)/1000);const e=$('stElapsed');if(e)e.textContent=tmp._elapsed+'s';},500);
  try{
    const body=taskIsR2V()
      ? {prompt,params:App.params,refs:{images:App.refsImages,audios:App.refsAudios.map(a=>a.fn),videos:App.refsVideos.map(v=>v.fn),use_video_audio:App.useVideoAudio}}
      : (()=>{const fm=App.params.frame_mode||'first';
          const b={prompt,params:App.params,frame_mode:fm};
          if(App.uploadedImage)b.image=App.uploadedImage;
          if(fm==='both'&&App.uploadedImageLast)b.image_last=App.uploadedImageLast;
          return b;})();
    const r=await api('/api/workspaces/'+encodeURIComponent(App.curWs)+'/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    tmp.job_id=r.job_id;tmp.params.width=r.width;tmp.params.height=r.height;tmp.params.length=r.length;tmp._phase=t('采样中');
    listenJob(r.job_id,tmp);
  }catch(e){tmp.status='error';tmp.error=e.message;tmp.traceback=e.traceback||'';clearInterval(genTimer);renderActive();setGenBusy(false);}
}
function listenJob(jobId,tmp){
  // 闭包直接持有 tmp 记录, 不再从 App.gens 重查 —— 切换工作区后仍能正确收尾 (不卡 busy/定时器)
  const gid=tmp.id;let retries=0;
  const stopWatch=()=>{clearInterval(genTimer);if(App.eventSource){App.eventSource.close();App.eventSource=null;}};
  const connect=()=>{
    const es=new EventSource('/api/jobs/'+jobId+'/events');App.eventSource=es;
    es.onmessage=ev=>{
      retries=0;let d;try{d=JSON.parse(ev.data);}catch(_){return;}
      if(d.type==='progress'){tmp._pct=d.max?Math.round(d.value/d.max*100):0;tmp._step=d.value;tmp._max=d.max;tmp._phase=t('采样中');updateGenProgress(gid,tmp);}
      else if(d.type==='status'){tmp._phase=transStatus(d.text)||t('处理中');updateGenProgress(gid,tmp);}
      else if(d.type==='done'){stopWatch();setGenBusy(false);showToast(t('生成完成'),'check');
        if(App.curWs===tmp.ws){ // 任务归属当前工作区: 刷新并选中新记录
          loadGens().then(()=>{const real=App.gens.find(x=>x.id===d.gen_id)||App.gens[0];if(real)App.currentGen=real;renderActive();});
        }else{showToast(t('已完成于工作区 {w}',{w:tmp.ws}),'check');} // 归属其它工作区: 只提示, 不污染当前列表
      }
      else if(d.type==='error'){stopWatch();tmp.status='error';tmp.error=d.message;tmp.traceback=d.traceback||'';renderActive();setGenBusy(false);showToast(t('生成失败'),'warn');}
    };
    es.onerror=()=>{
      if(es.readyState===EventSource.CLOSED){ // 404 等致命错误: 浏览器不会自动重连, 手动退避重试
        es.close();App.eventSource=null;
        if(++retries<=5)setTimeout(connect,1500*retries);
        else{tmp.status='error';tmp.error=t('进度连接中断, 请刷新查看结果');stopWatch();renderActive();setGenBusy(false);loadGens();}
      }
      // readyState===CONNECTING: 浏览器原生自动重连中, 不干预 (后端会重放最近事件/终态)
    };
  };
  connect();
}
function updateGenProgress(gid,g){
  if(App.view==='chat'){
    const wrap=document.querySelector(`.progress-wrap[data-gen="${gid}"]`);
    if(wrap){wrap.querySelector('.progress-fill').style.width=(g._pct||0)+'%';wrap.querySelector('.pct').textContent=g._step&&g._max?t('步 {s} / {m}',{s:g._step,m:g._max}):(g._phase||'');}
  }else if(App.view==='studio'){if(App.currentGen&&App.currentGen.id===gid)renderStudioStage(g);}
  else if(App.view==='overview'){
    const card=document.querySelector(`.ov-card[data-gen="${gid}"]`);
    if(card){const f=card.querySelector('.progress-fill');if(f)f.style.width=(g._pct||0)+'%';const p=card.querySelector('.pct');if(p)p.textContent=g._step&&g._max?t('步 {s} / {m}',{s:g._step,m:g._max}):(g._phase||'');}
  }
}

// ---- Studio 左栏: 分块渲染 + 缩略图懒加载 (避免大量历史一次性创建所有 video) ----
const ST_BATCH=40;                 // 每批渲染条数
let stRendered=0;                  // 已渲染条数 (过滤后列表内的索引上限)
let stFiltered=[];                 // 当前过滤后的列表
let stLazyObs=null;                // 缩略图 IntersectionObserver

function renderStudioLeft(){
  const el=$('stList');const q=$('stSearch').value.trim().toLowerCase();
  stFiltered=App.gens.filter(g=>!q||(g.prompt||'').toLowerCase().includes(q));
  $('stCount').textContent=stFiltered.length;
  if(!stFiltered.length){el.innerHTML='<div style="color:var(--text-dim);font-size:11px;padding:16px;text-align:center">'+t('暂无')+'</div>';return;}
  el.innerHTML='';
  stRendered=0;
  renderStudioBatch();
}
function renderStudioBatch(){
  const el=$('stList');
  const end=Math.min(stRendered+ST_BATCH,stFiltered.length);
  for(let i=stRendered;i<end;i++){el.appendChild(buildStudioItem(stFiltered[i],el));}
  stRendered=end;
  setupStudioLazy();
}
function buildStudioItem(g,el){
  const d=document.createElement('div');d.className='st-item';d.dataset.id=g.id;
  if(g.status==='error'||(g.error&&!g.video))d.classList.add('err');
  if(App.currentGen&&App.currentGen.id===g.id)d.classList.add('active');
  const r2v=isR2V(g);const refN=((g.refs&&g.refs.images)||[]).length;
  let thumb;
  if(g.status==='error'||(g.error&&!g.video))thumb='<div class="ph"><i class="fas fa-triangle-exclamation" style="color:var(--error)"></i></div>';
  else if(g.video)thumb=`<video muted preload="none" data-src="/api/workspaces/${encodeURIComponent(App.curWs)}/media/${encodeURIComponent(g.video)}"></video>`;
  else if(g.status==='running')thumb='<div class="ph"><span class="spinner" style="width:12px;height:12px;border-width:1.5px"></span></div>';
  else thumb='<div class="ph"><i class="fas fa-film"></i></div>';
  const model=g.params.model==='full'?'full':(g.params.model==='ref2va'?'ref2va':'pruned');const res=(g.params.width&&g.params.height)?g.params.width+'×'+g.params.height:t('原生');
  d.innerHTML=`<div class="st-thumb">${thumb}</div><div class="st-body"><div class="st-prompt">${esc(g.prompt||'')}</div><div class="st-meta"><span class="m ${model==='full'?'full':''}">${model}</span><span>${res}</span><span>${t('{n} 步',{n:g.params.steps})}</span><span>${fmtDur(g.params.duration||5)}</span>${r2v?`<span class="m">${t('×{n}图',{n:refN})}</span>`:''}</div></div><button class="st-reuse" title="${t('复用')}"><i class="fas fa-rotate"></i></button>${r2v?'':`<button class="st-cont" title="${t('续写')}"><i class="fas fa-forward"></i></button>`}`;
  d.onclick=()=>{
    // 只切 active 高亮 + 刷舞台, 不重建列表 (避免视频缩略图全部销毁重载)
    if(App.currentGen&&App.currentGen.id===g.id)return;
    App.currentGen=g;
    el.querySelectorAll('.st-item').forEach(x=>x.classList.toggle('active',x.dataset.id===g.id));
    renderStudioStage(g);
  };
  d.querySelector('.st-reuse').onclick=e=>{e.stopPropagation();reuseParams(g);};
  if(g.video&&!r2v)d.querySelector('.st-cont').onclick=e=>{e.stopPropagation();continueFromGen(g);};
  return d;
}
function setupStudioLazy(){
  if(stLazyObs)stLazyObs.disconnect();
  stLazyObs=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        const v=en.target;
        if(v.dataset.src&&!v.src){v.src=v.dataset.src;v.load();v.onloadeddata=()=>{try{v.currentTime=0.1;}catch(_){}};}
        stLazyObs.unobserve(v);
      }
    });
  },{root:$('stList'),rootMargin:'300px'});
  $('stList').querySelectorAll('video[data-src]').forEach(v=>stLazyObs.observe(v));
}
// 滚动到底部附近时加载下一批
$('stList').addEventListener('scroll',()=>{
  const el=$('stList');

      <div class="phase-info"><div class="pl"><span class="spinner"></span> ${esc(g._phase||t('生成中'))}</div><div class="ps">${g._step&&g._max?t('步 {s} / {m}',{s:g._step,m:g._max}):''}</div></div>

  }
  if(g.status==='error'||(g.error&&!g.video)){
    el.innerHTML=`<div class="st-error"><div class="err-card"><i class="fas fa-triangle-exclamation"></i><span class="err-msg">${esc(g.error||t('未知错误'))}</span>${g.traceback?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:11px;color:var(--text-sec)">${t('堆栈')}</summary><pre style="margin-top:6px;font-size:10px;white-space:pre-wrap;max-height:220px;overflow:auto;color:var(--text-sec);background:rgba(0,0,0,.2);padding:8px;border-radius:6px">${esc(g.traceback)}</pre></details>`:''}</div><button class="btn" onclick="reuseParams(App.currentGen)"><i class="fas fa-rotate"></i> ${t('复用参数重试')}</button></div>`;
    return;
  }
  if(g.video){
    const chips=paramsChips(g.params);
    const r2v=isR2V(g);const refsImgs=(g.refs&&g.refs.images)||[];const refsVids=(g.refs&&g.refs.videos)||[];
    const refStrip=(r2v&&(refsImgs.length||refsVids.length))?`<div class="si-refs">${refsImgs.map(f=>`<img src="/api/workspaces/${encodeURIComponent(App.curWs)}/media/${encodeURIComponent(f)}" title="${esc(f)}">`).join('')}${refsVids.map(f=>`<video muted preload="metadata" src="/api/workspaces/${encodeURIComponent(App.curWs)}/media/${encodeURIComponent(f)}#t=0.1" title="${esc(f)}"></video>`).join('')}${refsCountBadge(refsImgs.length)}${videoRefsBadge(refsVids.length)}${audioRefsBadge(((g.refs&&g.refs.audios)||[]).length)}</div>`:'';
    el.innerHTML=`<div class="st-done"><div class="st-video-wrap"><video controls autoplay src="/api/workspaces/${encodeURIComponent(App.curWs)}/media/${encodeURIComponent(g.video)}"></video><button class="st-expand" onclick="openLightbox(App.currentGen)"><i class="fas fa-expand"></i></button></div>
      <div class="st-info"><div class="si-prompt">${esc(g.prompt||'')}</div>${refStrip}<div class="si-chips">${chips.map(c=>`<span class="chip ${c.cls}">${c.t}</span>`).join('')}</div><div class="si-meta"><span><i class="far fa-clock"></i> ${relTime(g.timestamp)}</span>${g.duration?`<span>${t('耗时')} ${g.duration.toFixed(1)}s</span>`:''}<span>${t('{n} 帧',{n:g.params.length||'-'})}</span><span style="font-family:monospace">#${esc(g.id)}</span></div></div>
      <div class="st-actions"><button class="btn" onclick="reuseParams(App.currentGen)"><i class="fas fa-rotate"></i> ${t('复用')}</button>${r2v?'':`<button class="btn primary" onclick="continueFromGen(App.currentGen)"><i class="fas fa-forward"></i> ${t('续写')}</button>`}<button class="btn" onclick="downloadGen(App.currentGen)"><i class="fas fa-download"></i> ${t('下载')}</button><button class="btn danger" onclick="deleteGen(App.currentGen)"><i class="fas fa-trash-alt"></i> ${t('删除')}</button></div></div>`;

// ===== ACTIONS =====
function reuseParams(g, opts={}){
  if(!g)return;const p=g.params;
  const r2v=isR2V(g);
  App.params={model:r2v?'ref2va':p.model,steps:p.steps,res_mode:r2v?'custom':p.res_mode,custom_w:p.custom_w||p.width||1280,custom_h:p.custom_h||p.height||720,duration:p.duration||5,seed:p.seed||-1,low_vram:p.low_vram!==false,sage:!!p.sage,turbo_lora:!!p.turbo_lora,lora_name:p.lora_name||'',native_scale:p.native_scale||1.0,task_type:r2v?'r2v':(p.task_type==='t2v'?'t2v':'i2v'),frame_mode:(!r2v&&(p.frame_mode==='last'||p.frame_mode==='both'))?p.frame_mode:'first'};
  App.prompt=g.prompt||'';
  // 参考素材: r2v -> refsImages/refsAudios; i2v -> uploadedImage (续写复用截帧后的新图优先)
  if(r2v){
    App.refsImages=((g.refs&&g.refs.images)||[]).slice();
    if(!App.refsImages.length&&g.image)App.refsImages=[g.image];
    App.refsAudios=((g.refs&&g.refs.audios)||[]).map(fn=>({fn,dur:null}));
    App.refsVideos=((g.refs&&g.refs.videos)||[]).map(fn=>({fn,dur:null,aud:((g.refs&&g.refs.video_audios)||[]).includes(fn)}));
    App.useVideoAudio=(g.refs&&g.refs.use_video_audio)!==false; // 历史记录缺省视为开启
    App.uploadedImage=null;
    probeAudioDurations();probeVideoDurations();
  }else{
    App.refsImages=[];
    App.refsAudios=[];
    App.refsVideos=[];
    App.uploadedImage=(opts.image)||g.image||null;
    App.uploadedImageLast=g.image_last||null;

function parsePromptSections(v){
  const secs={};let pre='',cur=null;
  const isHead=ln=>/^(subject_definitions|summary|retention_analysis|detailed_description|overall_soundscape|non_diegetic_music):\s*$/.test(ln);
  for(const ln of (v||'').split('\n')){
    if(isHead(ln)){cur=ln.slice(0,-1).trim();secs[cur]=secs[cur]||[];continue;}
    if(cur)secs[cur].push(ln);
    else if(pre||ln.trim())pre=pre?pre+'\n'+ln:ln;
  }
  const out={};
  R2V_SECTIONS.forEach(s=>out[s]=(secs[s]||[]).join('\n').trim());
  return {secs:out,pre:pre.trim()};
}
function buildSplit(){

  R2V_SECTIONS.forEach(s=>{const ta=box.querySelector(`textarea[data-sec="${s}"]`);if(ta)ta.value=p.secs[s];});

function updateSecCounts(){

function insToken(text){

    const box=$('cSplit');
    let ta=document.activeElement&&document.activeElement.matches('#cSplit textarea')?document.activeElement:box.querySelector('textarea[data-sec]');
    if(!ta)return;
    const s=ta.selectionStart||0,e=ta.selectionEnd||s;

  }

// --- 镜像高亮 (违规 token 标红/黄) ---
function r2vSpans(prompt,refs){
  const spans=[];let m;
  const rp=/<Picture\s+(\d+)\s*>/g;
  while((m=rp.exec(prompt))){if(+m[1]>refs)spans.push({s:m.index,e:rp.lastIndex,cls:'err'});}
  const ra=/<Audio\s+(\d+)\s*>/g;
  while((m=ra.exec(prompt))){if(+m[1]>App.refsAudios.length)spans.push({s:m.index,e:ra.lastIndex,cls:'err'});}
  const ro=/<Object\b[^>]*>/gi;
  while((m=ro.exec(prompt)))spans.push({s:m.index,e:ro.lastIndex,cls:'err'});
  const subs=[...prompt.matchAll(/<Subject\s+(\d+)\s*>/g)].map(x=>({n:+x[1],s:x.index,e:x.index+x[0].length}));
  if(subs.length){
    const mx=Math.max(...subs.map(x=>x.n));
    let gap=null;
    for(let k=1;k<=mx;k++){if(!subs.some(x=>x.n===k)){gap=k;break;}}
    if(gap)subs.filter(x=>x.n>gap).forEach(x=>spans.push({s:x.s,e:x.e,cls:'warn'}));
  }
  return spans;
}
function highlightHtml(v){
  const spans=r2vSpans(v||'',App.refsImages.length);
  let out='',pos=0;
  if(!spans.length){out=esc(v||'');}
  else{
    for(const sp of spans){
      if(sp.s>pos)out+=esc((v||'').slice(pos,sp.s));
      out+=`<span class="hg ${sp.cls}">${esc((v||'').slice(sp.s,sp.e))}</span>`;
      pos=sp.e;
    }
    if(pos<(v||'').length)out+=esc((v||'').slice(pos));
  }
  return out+(v&&v.endsWith('\n')?'<br>':'')||'<br>';
}
function syncMirror(){
  const m=$('cMirror'),ta=$('cPrompt');if(!m||!ta)return;
  m.innerHTML=highlightHtml(ta.value);
  m.scrollTop=ta.scrollTop;
}

function r2vLiveIssues(prompt){
  const refs=App.refsImages.length,auds=App.refsAudios.length,vids=App.refsVideos.length;const issues=[];
  const pics=[...prompt.matchAll(/<Picture\s+(\d+)\s*>/g)].map(m=>+m[1]);
  if(pics.length&&Math.max(...pics)>refs)issues.push({t:'err',m:t('<Picture {n}> 越界：当前只上传了 {c} 张参考图',{n:Math.max(...pics),c:refs})});
  const vds=[...prompt.matchAll(/<Video\s+(\d+)\s*>/g)].map(m=>+m[1]);
  if(vds.length&&Math.max(...vds)>vids)issues.push({t:'err',m:t('<Video {n}> 越界：当前只上传了 {c} 段参考视频',{n:Math.max(...vds),c:vids})});
  const ab=audioOrdinalBase();
  const am=[...prompt.matchAll(/<Audio\s+(\d+)\s*>/g)].map(m=>+m[1]);
  if(am.length&&Math.max(...am)>ab+auds)issues.push({t:'err',m:t('<Audio {n}> 越界：当前可用音频编号只有 {c} 个',{n:Math.max(...am),c:ab+auds})});
  if(refs+vids+auds>R2V_REF_TOTAL_MAX)issues.push({t:'err',m:t('参考素材总数 (图+视频+音频) 不能超过 12 个')});
  const vs=App.refsVideos.reduce((a,x)=>a+(x.dur||0),0);
  if(vs>15)issues.push({t:'err',m:t('参考视频总时长 {s}s 超过 15s 上限',{s:vs.toFixed(1)})});
  if(/<Object\s/i.test(prompt))issues.push({t:'err',m:t('官方语法禁止 <Object x>，请改用 <Subject N> 连续编号')});
  const subs=[...prompt.matchAll(/<Subject\s+(\d+)\s*>/g)].map(m=>+m[1]);
  if(subs.length){const mx=Math.max(...subs);for(let k=1;k<=mx;k++){if(!subs.includes(k)){issues.push({t:'warn',m:t('<Subject {k}> 缺失：主体编号需从 1 连续（现有最大 {m}）',{k,mx})});break;}}}
  if(prompt.length>4000)issues.push({t:'err',m:t('字数 {n}/4000 超限',{n:prompt.length})});
  return issues;
}

  if(!issues.length){
    const au=App.refsAudios.length;
    box.innerHTML='<div class="c-ok"><i class="fas fa-circle-check"></i> '+t('语法 OK · 与 {a} 张参考图',{a:App.refsImages.length})+(au?t(' + {b} 段音频',{b:au}):'')+t(' 匹配（生成前仍会终检）')+'</div>';
    return;
  }
  box.innerHTML=issues.slice(0,4).map(x=>`<div class="c-issue ${x.t}"><i class="fas ${x.t==='err'?'fa-xmark':'fa-triangle-exclamation'}"></i> ${esc(x.m)}</div>`).join('');
}
// --- composer 事件 ---
$('cClose').onclick=closeComposer;
$('cApplyBtn').onclick=applyDraft;
$('cGenBtn').onclick=()=>{closeComposer();generate();};
$('cModeWhole').onclick=()=>setComposerMode('whole');
$('cModeSplit').onclick=()=>setComposerMode('split');
$('cPrompt').addEventListener('input',()=>{syncComposerState();syncMirror();});
$('cPrompt').addEventListener('scroll',()=>{const m=$('cMirror');if(m)m.scrollTop=$('cPrompt').scrollTop;});
$('cPrompt').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();closeComposer();generate();}});
$('cSplit').addEventListener('input',e=>{const ta=e.target.closest('textarea[data-sec]');if(!ta)return;updateSecCounts();joinAndSync();});
$('cSplit').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();closeComposer();generate();}});
$('cRefFiles').onchange=e=>{ // P3: 按类型分发 (视频进参考视频通道, 其余进图片)
  const fs=[...e.target.files];
  const vids=fs.filter(f=>f.type&&f.type.startsWith('video/'));
  const imgs=fs.filter(f=>!f.type||!f.type.startsWith('video/'));
  if(vids.length)addRefVideoFiles(vids);
  if(imgs.length)addRefImageFiles(imgs);
  e.target.value='';};
$('cAudFiles').onchange=e=>{addRefAudioFiles([...e.target.files]);e.target.value='';};
$('composer').addEventListener('mousedown',e=>{if(e.target===$('composer'))closeComposer();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&composerOpen())closeComposer();});
$('chipComposer').onclick=openComposer;


// ===== MISC =====
$('newWsBtn').onclick=async()=>{const name=prompt(t('工作区名称：'),t('工作区')+(App.workspaces.length+1));if(!name)return;try{await api('/api/workspaces',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim()})});await loadWorkspaces();await selectWs(name.trim());showToast(t('已创建'),'check');}catch(e){showToast(t('创建失败: ')+e.message,'warn');}};
$('wsSel').onchange=()=>{if($('wsSel').value)selectWs($('wsSel').value);};
$('refreshBtn').onclick=()=>{loadGens();checkComfy();showToast(t('已刷新'),'check');};

// ===== LANGUAGE SWITCH =====
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

// expose for inline onclick
window.reuseParams=reuseParams;window.continueFromGen=continueFromGen;window.downloadGen=downloadGen;window.deleteGen=deleteGen;window.openLightbox=openLightbox;window.insertSixSkeleton=insertSixSkeleton;window.openComposer=openComposer;window.closeComposer=closeComposer;window.clearComposer=clearComposer;window.applyDraft=applyDraft;window.loadExample=loadExample;window.App=App;

// ===== INIT =====
(async function init(){
  applyLang();
  switchView('studio');
  if($('stGuideBody'))$('stGuideBody').innerHTML=guideHtml();
  await checkComfy();
  await loadWorkspaces();
  if(App.workspaces.length){await selectWs(App.workspaces[0].name);}
  syncTaskUI();syncPopup();syncStudioPanel();
  setInterval(checkComfy,30000);
  updateGenBtns();
})();
</script>
</body>
